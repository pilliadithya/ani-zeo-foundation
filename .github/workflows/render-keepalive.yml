name: Render keep-alive A

on:
  schedule:
    # This workflow runs once every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ani-zeo-render-keepalive-a
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Ani Zeo health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 100 "https://ani-zeo-foundation.onrender.com/")"
          printf '%s' "${response}" | grep -Eq '"service"[[:space:]]*:[[:space:]]*"ani-zeo"'
          echo "Ani Zeo health endpoint verified."
