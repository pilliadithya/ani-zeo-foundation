name: Render keep-alive

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub Actions queue delays.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ani-zeo-render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Send two sequential health checks to Ani Zeo
        shell: bash
        run: |
          set -uo pipefail
          url="https://ani-zeo-foundation.onrender.com/"
          successful_checks=0

          for check in 1 2; do
            echo "Keep-alive request ${check}/2"
            if response="$(curl --fail --silent --show-error --max-time 100 "${url}")" &&
              printf '%s' "${response}" | grep -Eq '"service"[[:space:]]*:[[:space:]]*"ani-zeo"'; then
              echo "Request ${check}/2: Ani Zeo health endpoint verified."
              successful_checks=$((successful_checks + 1))
            else
              echo "Request ${check}/2 did not return the expected health payload."
            fi
          done

          echo "Successful health checks: ${successful_checks}/2"
          if [ "${successful_checks}" -eq 0 ]; then
            echo "Both keep-alive requests failed."
            exit 1
          fi
          echo "At least one Ani Zeo health check succeeded."
