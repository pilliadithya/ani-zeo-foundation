name: Extract Ani Zeo Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("ani_zeo_foundation_v0_1.zip")

          if not archive.exists():
              raise SystemExit("Project ZIP not found!")

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  parts = Path(item.filename).parts

                  if not parts or parts[0] != "ani_zeo":
                      continue

                  relative = parts[1:]

                  if not relative:
                      continue

                  if "__pycache__" in relative or item.filename.endswith(".pyc"):
                      continue

                  target = Path(*relative)

                  if target.is_absolute() or ".." in target.parts:
                      raise SystemExit("Unsafe ZIP path detected!")

                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(item))

          archive.unlink()
          print("Ani Zeo project extracted successfully!")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Ani Zeo project files"
            git push
          else
            echo "No changes to commit."
          fi
