name: Render keep-alive B

on:
  schedule:
    # Independent workflow staggered 2 minutes after keep-alive A.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ani-zeo-render-keepalive-b
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Ani Zeo health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 100 "https://ani-zeo-foundation.onrender.com/")"
          printf '%s' "${response}" | grep -Eq '"service"[[:space:]]*:[[:space:]]*"ani-zeo"'
          echo "Ani Zeo health endpoint verified."
